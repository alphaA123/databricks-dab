# This is a Databricks asset bundle definition for data_rdv.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: data_rdv
  uuid: 8cd1868c-639a-4325-b539-22153d6d3121

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: python -m build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405609897159635.15.azuredatabricks.net
    variables:
      catalog: barclays_rdv
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405609897159635.15.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/abhishekkgodda@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/abhishekkgodda@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: barclays_rdv
      schema: prod
    permissions:
      - user_name: abhishekkgodda@gmail.com
        level: CAN_MANAGE
